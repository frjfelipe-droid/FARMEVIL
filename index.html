<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>A Colheita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: aconchegante de dia, sinistro à noite; fazenda pixel-art que vira ficção científica
IDEA: um cartucho 16-bit: molduras de madeira, papel de recado e telas holográficas alienígenas
PICTURE: o mundo do jogo em tela cheia; título com paisagem animada ao entardecer
COLOUR and TYPE: verde-pasto, madeira, vermelho-celeiro, acento verde-alienígena; Pixelify Sans
LAYOUT: tela cheia, HUD no topo, controles de toque embaixo, faixas de cinema nas cutscenes
*/
:root{color-scheme:dark;--wood:#5b3a22;--wood2:#7a5030;--paper:#f4e7c8;--ink:#2a1a0e;--alien:#7cff6b;--red:#b8322a;--gold:#f2c94c}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Pixelify Sans',ui-monospace,monospace;color:var(--paper)}
canvas#cv{position:fixed;inset:0;display:block;image-rendering:pixelated}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:6px;transition:opacity .4s,transform .4s}
#hud{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:linear-gradient(#3a2414,#2a1a0e);border:2px solid #c9a066;border-radius:8px;padding:3px 9px;font-size:15px;display:flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.pill img{width:16px;height:16px;image-rendering:pixelated}
#hDay{position:relative;overflow:hidden;padding-bottom:6px}
#dayBar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#ffb36a,#ffe08a,#ff7a4a,#3a4a8a);width:0}
#hbtn{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
#bMap{pointer-events:auto;background:linear-gradient(#3a2414,#2a1a0e);border:2px solid #c9a066;color:var(--paper);border-radius:8px;min-width:44px;min-height:36px;box-shadow:0 2px 0 rgba(0,0,0,.5);display:grid;place-items:center;padding:0 6px}
#bMenu{pointer-events:auto;background:linear-gradient(#3a2414,#2a1a0e);border:2px solid #c9a066;color:var(--paper);border-radius:8px;min-width:44px;min-height:36px;font-size:18px;box-shadow:0 2px 0 rgba(0,0,0,.5)}
#obj{display:flex}
#obj span{background:rgba(244,231,200,.94);color:var(--ink);border-left:5px solid var(--red);padding:4px 10px;border-radius:4px;font-size:14px;max-width:100%;box-shadow:0 2px 0 rgba(0,0,0,.35)}
#obj span.new{animation:objp .8s}
@keyframes objp{0%{transform:translateX(-12px);background:#ffe08a}100%{transform:none}}
#obj span:empty{display:none}
#toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:58;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,520px)}
.tst{background:rgba(20,14,8,.9);border:2px solid #c9a066;padding:6px 12px;border-radius:8px;font-size:15px;text-align:center;animation:tin .3s cubic-bezier(.2,1.4,.4,1)}
.tst.alien{border-color:var(--alien);color:#d9ffd2;box-shadow:0 0 14px rgba(124,255,107,.35)}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
#hotbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 178px);display:flex;gap:4px;z-index:6;background:linear-gradient(#4a2e1a,#2a1a0e);padding:4px;border-radius:10px;border:2px solid #c9a066;box-shadow:0 3px 0 rgba(0,0,0,.5)}
#hotbar button{width:44px;height:44px;border-radius:7px;border:2px solid #6b4a2a;background:#3a2414;position:relative;padding:0;display:grid;place-items:center;transition:transform .12s}
#hotbar button img{width:30px;height:30px;image-rendering:pixelated}
#hotbar button.sel{border-color:#ffe08a;background:#6b4a2a;box-shadow:0 0 0 2px #ffe08a inset;transform:translateY(-3px)}
#hotbar button b{position:absolute;right:2px;bottom:0;font-size:11px;color:#fff;text-shadow:1px 1px 0 #000}
#stickZone{position:fixed;left:0;bottom:0;width:55%;height:44%;z-index:4}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.25);display:none;z-index:5;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(244,231,200,.55);border:3px solid rgba(255,255,255,.6)}
#stickHint{position:fixed;left:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 48px);width:110px;height:110px;border-radius:50%;border:3px dashed rgba(255,255,255,.18);z-index:3;pointer-events:none;display:grid;place-items:center;color:rgba(255,255,255,.35);font-size:12px}
#btns{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:6;display:grid;grid-template-columns:auto auto;gap:10px;align-items:end;justify-items:end}
.rb{border-radius:50%;border:3px solid #ffe08a;color:#2a1a0e;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.35);display:grid;place-items:center;text-align:center;line-height:1.05;padding:4px}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#bA{width:96px;height:96px;background:radial-gradient(circle at 40% 30%,#ffe08a,#f2c94c 60%,#c99a2a);font-size:14px;grid-column:2;grid-row:1/3}
#bInv{width:62px;height:62px;background:radial-gradient(circle at 40% 30%,#c9ffbf,#7cff6b 60%,#3aa04a);border-color:#d9ffd2;font-size:11px;display:none}
#bCr{width:62px;height:62px;background:radial-gradient(circle at 40% 30%,#ead2a8,#c9a066 60%,#8a6a3a);font-size:11px;display:none}
#bCr.on{background:#ffe08a;box-shadow:0 0 0 4px #fff inset}
#bInv.on{background:#38e8ff;box-shadow:0 0 18px #38e8ff}
#invwrap{display:none;align-items:center;gap:6px;background:rgba(4,22,16,.85);border:2px solid #7cff6b;border-radius:8px;padding:3px 8px;font-size:12px;color:#d9ffd2;width:fit-content;box-shadow:0 0 10px rgba(124,255,107,.3)}
#invbar{width:110px;height:8px;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden}
#invfill{height:100%;width:100%;background:linear-gradient(90deg,#38e8ff,#7cff6b)}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(96vw,640px);z-index:55;display:none;background:var(--paper);color:var(--ink);border:4px solid var(--wood);border-radius:12px;padding:12px 14px 14px;box-shadow:0 0 0 3px #c9a066,0 8px 0 rgba(0,0,0,.5);min-height:120px;animation:din .25s ease-out}
@keyframes din{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#dlg.sys{background:rgba(4,22,16,.94);color:#bfffd0;border-color:#1f6b4a;box-shadow:0 0 0 3px var(--alien),0 0 28px rgba(124,255,107,.4);text-shadow:0 0 6px rgba(124,255,107,.5)}
#dlg.sys::before{content:'';position:absolute;inset:0;border-radius:8px;background:repeating-linear-gradient(0deg,rgba(124,255,107,.06) 0 2px,transparent 2px 4px);pointer-events:none}
#dPort{float:left;width:58px;height:58px;margin:0 10px 4px 0;border:3px solid var(--wood);border-radius:8px;background:#c9a066;image-rendering:pixelated}
#dlg.sys #dPort{border-color:var(--alien);background:#0a2a1e}
#dName{display:inline-block;background:var(--wood);color:var(--paper);padding:2px 10px;border-radius:6px;font-size:14px;margin-bottom:6px;font-weight:600}
#dlg.sys #dName{background:#1f6b4a;color:#d9ffd2}
#dText{font-size:18px;line-height:1.35;min-height:50px;white-space:pre-wrap}
#dChoices{display:flex;flex-direction:column;gap:8px;margin-top:10px;clear:both}
#dChoices button{text-align:left;background:#fff6dd;border:3px solid var(--wood2);border-radius:8px;padding:10px 12px;font-size:16px;color:var(--ink);min-height:44px;box-shadow:0 3px 0 var(--wood2)}
#dChoices button::before{content:'▶ ';color:var(--red)}
#dlg.sys #dChoices button{background:#0d2a20;color:#d9ffd2;border-color:var(--alien);box-shadow:0 3px 0 #1f6b4a}
#dChoices button:active{transform:translateY(2px);box-shadow:none}
#dNext{position:absolute;right:14px;bottom:8px;font-size:14px;animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
#panel{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
#pBox{width:min(94vw,470px);max-height:86vh;overflow:auto;background:var(--paper);color:var(--ink);border:4px solid var(--wood);border-radius:12px;box-shadow:0 0 0 3px #c9a066,0 10px 0 rgba(0,0,0,.5);padding:14px;animation:pin .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
#pBox h2{margin:0 0 4px;font-size:26px;line-height:1.05;color:var(--wood)}
#pSub{font-size:14px;opacity:.8;margin-bottom:10px}
.opt{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:#fff6dd;border:3px solid var(--wood2);border-radius:9px;padding:10px 12px;margin:7px 0;font-size:16px;color:var(--ink);min-height:48px;box-shadow:0 3px 0 var(--wood2);transition:transform .1s}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt small{display:block;font-size:13px;opacity:.7}
.opt:disabled{opacity:.45;box-shadow:none}
.opt img{width:28px;height:28px;image-rendering:pixelated}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:2px dashed #d8c49c;font-size:15px}
.row img{width:26px;height:26px;image-rendering:pixelated}
.row .nm{flex:1}
.row .pr{white-space:nowrap;font-weight:600}
.row button{background:var(--wood2);color:var(--paper);border:0;border-radius:7px;padding:8px 10px;min-height:40px;font-size:14px;box-shadow:0 3px 0 var(--wood)}
.row button:disabled{opacity:.4}
.sl{display:flex;flex-direction:column;gap:4px;margin:12px 0;font-size:16px}
.sl input[type=range]{width:100%;accent-color:var(--red);height:28px}
.tg{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:16px;gap:10px}
.tg button{min-width:86px;min-height:40px;border-radius:8px;border:3px solid var(--wood2);background:#fff6dd;color:var(--ink)}
.tg button.on{background:var(--gold)}
.close{width:100%;margin-top:12px;background:var(--wood);color:var(--paper);border:0;border-radius:9px;padding:12px;font-size:17px;box-shadow:0 4px 0 #2a1a0e}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:70;transition:opacity .5s}
#fadeText{position:fixed;inset:0;z-index:71;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:24px;pointer-events:none;opacity:0;transition:opacity .7s;color:#f4e7c8;line-height:1.4;text-shadow:0 2px 0 #000}
#fadeText small{display:block;font-size:15px;opacity:.75;margin-top:6px}
#prompt{position:fixed;z-index:4;pointer-events:none;transform:translate(-50%,-100%);background:rgba(244,231,200,.96);color:var(--ink);padding:2px 8px;border-radius:6px;font-size:13px;border:2px solid var(--wood);white-space:nowrap;display:none;box-shadow:0 2px 0 rgba(0,0,0,.4)}
#title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 7vh) 20px calc(env(safe-area-inset-bottom,0px) + 4vh);text-align:center;pointer-events:none}
#title>*{pointer-events:auto}
#logo{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#logo .pre{font-size:15px;letter-spacing:1px;color:#ffe0b0;text-shadow:0 2px 0 #000;opacity:.9}
#logo h1{margin:0;font-size:clamp(50px,15vw,104px);line-height:.95;color:#ffe08a;text-shadow:0 4px 0 #a0401a,0 8px 0 #2a1a0e,0 0 40px rgba(124,255,107,.45);display:flex}
#logo h1 span{display:inline-block;animation:wav 2.4s ease-in-out infinite}
@keyframes wav{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#logo p{margin:4px 0 0;font-size:16px;max-width:30ch;color:#f4e7c8;text-shadow:0 2px 0 #000}
#tmenu{display:flex;flex-direction:column;gap:10px;align-items:center;background:rgba(10,8,20,.45);padding:16px;border-radius:14px;border:2px solid rgba(255,224,138,.35);backdrop-filter:blur(3px)}
.tb{min-width:230px;min-height:50px;background:linear-gradient(#ffe08a,#f2c94c);border:4px solid #2a1a0e;border-radius:10px;font-size:20px;color:#2a1a0e;box-shadow:0 5px 0 #2a1a0e;font-weight:700;transition:transform .1s}
.tb:hover{transform:translateY(-2px)}
.tb:active{transform:translateY(4px);box-shadow:0 1px 0 #2a1a0e}
.tb.alt{background:linear-gradient(#ead2a8,#c9a066);font-size:17px;min-height:44px}
#tfoot{font-size:12px;opacity:.7;text-shadow:0 1px 0 #000}
body.cine #top,body.cine #btns,body.cine #hotbar,body.cine #invbar,body.cine #stickHint,body.cine #prompt,body.cut #top,body.cut #btns,body.cut #hotbar,body.cut #invbar,body.cut #stickHint,body.cut #prompt{opacity:0;pointer-events:none!important}
body.cine #btns *,body.cut #btns *{pointer-events:none}
body.title.pop #title{visibility:hidden}
body.title #top,body.title #btns,body.title #hotbar,body.title #invbar,body.title #stickHint,body.title #prompt,body.title #stickZone{display:none!important}
#btns,#hotbar,#invbar,#stickHint{transition:opacity .4s}
.hide{display:none!important}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.mtabs button{flex:1 1 70px;min-height:38px;border-radius:8px;border:3px solid var(--wood2);background:#fff6dd;color:var(--ink);font-size:14px}
.mtabs button.on{background:var(--gold)}
#parch{width:100%;display:block;border-radius:6px}
.legend{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:5px;font-size:14px}
.legend li{display:flex;gap:8px;align-items:flex-start;line-height:1.25}
.legend b{flex:none;width:22px;height:22px;border-radius:50%;background:#f4e7c8;border:2px solid var(--wood);display:grid;place-items:center;font-size:12px}
.legend small{opacity:.7}
@media (prefers-reduced-motion:reduce){#logo h1 span{animation:none}}
</style>
</head>
<body class="title">
<canvas id="cv"></canvas>
<div id="top"><div id="hud">
  <div class="pill" id="hDay"><span id="hDayT">Dia 1 · 06:00</span><div id="dayBar"></div></div>
  <div class="pill" id="hMoney">R$ 50</div>
  <div class="pill" id="hCows">10</div>
  <div class="pill" id="hGoods"></div>
  <div id="hbtn"><button id="bMap" aria-label="Mapa"><svg width="22" height="18" viewBox="0 0 22 18"><path d="M1 3l6-2 8 2 6-2v14l-6 2-8-2-6 2z" fill="#e9d7a8" stroke="#2a1a0e" stroke-width="1.5"/><path d="M7 1v14M15 3v14" stroke="#a07840" stroke-width="1.2"/><circle cx="11" cy="8" r="2" fill="#b8322a"/></svg></button><button id="bMenu" aria-label="Menu">☰</button></div>
</div><div id="obj"><span id="objT"></span></div><div id="invwrap">ENERGIA<div id="invbar"><div id="invfill"></div></div></div></div>
<div id="toast"></div>
<div id="prompt"></div>
<div id="hotbar"></div>
<div id="stickZone"></div>
<div id="stickHint">mover</div>
<div id="stick"><div id="knob"></div></div>
<div id="btns">
  <button class="rb" id="bInv">INVISÍVEL</button>
  <button class="rb" id="bA">AÇÃO</button>
  <button class="rb" id="bCr">AGACHAR</button>
</div>
<div id="dlg"><canvas id="dPort" width="24" height="24"></canvas><div id="dName"></div><div id="dText"></div><div id="dChoices"></div><div id="dNext">▼</div></div>
<div id="panel"><div id="pBox"><h2 id="pTitle"></h2><div id="pSub"></div><div id="pBody"></div><button class="close" id="pClose">Fechar</button></div></div>
<div id="fade"></div>
<div id="fadeText"></div>
<div id="title">
  <div id="logo">
    <div class="pre">UMA HISTÓRIA DA ROÇA</div>
    <h1 id="logoH"></h1>
    <p>Cuide da fazenda e das suas 10 vacas... e descubra o que leva elas à noite.</p>
  </div>
  <div id="tmenu">
    <button class="tb" id="tNew">Novo jogo</button>
    <button class="tb alt hide" id="tCont">Continuar</button>
    <button class="tb alt" id="tOpt">Opções</button>
    <button class="tb alt" id="tHelp">Como jogar</button>
  </div>
  <div id="tfoot">Toque na tela para ativar o som · Capítulo 1</div>
</div>

<script>
{
'use strict';
/* ================= BASICS ================= */
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const T=16;
let DPR=Math.min(2,window.devicePixelRatio||1),W=0,H=0,ZOOM=4;
const lightC=document.createElement('canvas'),lg=lightC.getContext('2d');
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d};
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g]}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const waitFor=cond=>new Promise(r=>{const iv=setInterval(()=>{if(cond()){clearInterval(iv);r()}},100)});
function hex(c){const n=parseInt(c.slice(1),16);return[n>>16,(n>>8)&255,n&255]}
function mix(a,b,t){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.width=Math.floor(innerWidth*DPR);H=cv.height=Math.floor(innerHeight*DPR);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  ZOOM=Math.max(2,Math.min(W/(13*T),H/(11.5*T)));ZOOM=Math.round(ZOOM*2)/2;lightC.width=Math.ceil(W/3);lightC.height=Math.ceil(H/3)}
resize();addEventListener('resize',resize);
const OPT={music:.8,sfx:.8,shake:true,speed:1,guide:true};
try{Object.assign(OPT,JSON.parse(localStorage.getItem('colheita_opts')||'{}'))}catch(e){}
function saveOpt(){try{localStorage.setItem('colheita_opts',JSON.stringify(OPT))}catch(e){}}
$('logoH').innerHTML=[...'A COLHEITA'].map((c,i)=>c===' '?'<span>&nbsp;</span>':`<span style="animation-delay:${i*.09}s">${c}</span>`).join('');

/* ================= PIXEL FONT ================= */
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',4:'101101111001001',5:'111100110001110',6:'011100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001110','!':'010010010000010','-':'000000111000000','>':'100010001010100','.':'000000000000010'};
function pText(g,str,x,y,col,s=1){g.fillStyle=col;let cx=x;for(const ch of str.toUpperCase()){const gl=FONT[ch];if(gl)for(let i=0;i<15;i++)if(gl[i]==='1')g.fillRect(cx+(i%3)*s,y+((i/3)|0)*s,s,s);cx+=4*s}}

function plotAt(x,y){const cx=Math.floor((x-FIELD.x)/16),cy=Math.floor((y-FIELD.y)/16);if(cx<0||cy<0||cx>=FIELD.cols||cy>=FIELD.rows)return-1;return cy*FIELD.cols+cx}
function findTarget(){let best=null,bd=1e9;
  for(const it of M.inter){if(it.cond&&!it.cond())continue;const d=dist(P.x,P.y,it.x,it.y);if(d<(it.r||22)&&d<bd){best=it;bd=d}}
  for(const n of M.npcs){const d=dist(P.x,P.y,n.x,n.y);if(d<22&&d<bd){bd=d;best={x:n.x,y:n.y-20,label:'Conversar: '+n.name,fn:()=>talk(n)}}}
  if(M.name==='celeiro')for(const c of S.cows){if(c.state!=='barn')continue;const st=STALLS[c.seed];const ax=st.x,ay=st.top?94:126;const d=dist(P.x,P.y,ax,ay);if(d<18&&d<bd){bd=d;best={x:st.x,y:st.y-18,label:c.milked?`${c.name} (já ordenhada)`:`Ordenhar ${c.name}`,fn:()=>milkCow(c)}}}
  if(M.name==='farm'){for(const c of S.cows){if(c.state!=='field')continue;const d=dist(P.x,P.y,c.x,c.y);if(d<22&&d<bd){bd=d;best={x:c.x,y:c.y-18,label:`Guiar vacas (${c.name})`,fn:herd}}}

async function mainMenu(){const k=await menu('Pausa',[{label:'Continuar',sub:'Voltar ao jogo'},{label:'Mapa',sub:'Onde fica cada coisa (tecla M)'},{label:'Tarefas do dia',sub:'O que falta fazer'},{label:'Bolsa',sub:`Leite ${S.inv.milk} · Queijo ${S.inv.cheese} · Milho ${S.inv.veg.milho} · Cenoura ${S.inv.veg.cenoura} · Abóbora ${S.inv.veg.abobora}`},{label:'Opções',sub:'Volume, tremor de tela, texto'},{label:'Como jogar',sub:'Controles e dicas'},{label:'Voltar ao título',sub:'O progresso é salvo ao dormir'}],`Dia ${S.day} · ${hhmm(S.min)} · ${S.cows.length} vacas`);
  if(k===1)openMap();if(k===2)showTasks();if(k===4)optionsPanel();if(k===5)script(async()=>{await say(HELP)});if(k===6)location.reload()}
async function introScene(){await script(async()=>{
  S.min=325;cine(true);P.hidden=true;CINE.cam={x:MARK.x,y:300};CINE.z=1.1;IRIS=0;await irisTo(1,1400);
  CINE.title={t:'Fazenda Boa Vista',s:'Interior do Brasil · madrugada',life:3.2};
  const t0=performance.now();const tl=()=>{const k=Math.min(1,(performance.now()-t0)/5200);S.min=325+35*k;if(k<1)requestAnimationFrame(tl)};tl();
  await camTo(260,220,5200,1);sfx('rooster');await camTo(88,150,1800,1.25);
  sfx('door');P.x=88;P.y=114;P.dir='d';P.hidden=false;await walkTo(88,134,30);await sleep(300);P.dir='r';await sleep(400);P.dir='d';
  await say([{n:'Você',t:'Ahh... mais um dia na fazenda. Bom dia, mundo!'}]);await camRelease(800);cine(false);
  await say([{n:'',t:'Suas 10 vacas esperam no celeiro. Separe o feno, encha a água, colete o leite e solte-as no pasto.'},{n:'',t:'Depois pegue a caminhonete e vá à cidade: compre sementes e venda leite e queijo. Volte às 18h para guardar as vacas.'},{n:'Dica',t:'Use o direcional para andar e AÇÃO para interagir. O ☰ no canto mostra as tarefas, as opções e as dicas.'}])})}
function startGame(s){titleMode=false;document.body.classList.remove('title');$('title').classList.add('hide');initAudio();S=s||newState();P=newPlayer(88,124);
  MAPS={casa:buildHouseIn(),celeiro:buildBarnIn(),farm:buildFarm(),city:MAPS.city||buildCity(),vizinho:MAPS.vizinho||buildNeighbor(),floresta:buildForest()};buildHotbar();loadMap('farm',88,124);updHUD();updateButtons();
  if(!s)introScene();else script(async()=>{IRIS=0;await fadeText(`Dia ${S.day}`,1300);await irisTo(1,800)})}
$('tNew').addEventListener('click',()=>{initAudio();sfx('ui');const tl=$('title');tl.style.transition='opacity .6s';tl.style.opacity=0;setTimeout(()=>{tl.style.opacity=1;startGame(null)},600)});
$('tCont').addEventListener('click',()=>{initAudio();sfx('ui');const s=loadSave();if(s){s.cows.forEach(c=>c.state='barn');startGame(s)}});
$('tOpt').addEventListener('click',()=>{initAudio();sfx('ui');optionsPanel()});
$('tHelp').addEventListener('click',()=>{initAudio();sfx('ui');menu('Como jogar',HELP.map(h=>({label:h.t})).concat([{label:'Teclado: WASD/setas para andar, E ou Espaço = ação, Q = invisível, C = agachar, 1–6 = ferramentas, Esc = pausa.'}]))});
if(loadSave())$('tCont').classList.remove('hide');
cv.addEventListener('pointerdown',()=>{if(CUT&&CUT.draw===drawGameOver&&CUT.t>2.5){try{localStorage.removeItem('colheita_save')}catch(e){}location.reload()}if(CUT&&CUT.draw===drawEndCard&&CUT.t>3.5)endCut()});
addEventListener('keydown',e=>{if(CUT&&CUT.draw===drawEndCard&&CUT.t>3.5&&(e.code==='Space'||e.code==='Enter'))endCut()});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
S=newState();P=newPlayer(0,0);MAPS.city=buildCity();MAPS.vizinho=buildNeighbor();
document.addEventListener('pointerdown',()=>{initAudio();if(titleMode)playMusic('title')},{once:true});
window.__G={get S(){return S},get P(){return P},get M(){return M},get CUT(){return CUT},loadMap,MAPS,startGame,sleepNight,gotoStealth,TR,script,say,abductionScene};
requestAnimationFrame(loop);
}
</script>
